<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root { --red: #c8102e; --ink: #231918; --muted: #6b5f5d; --bg: #fff8f7; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }
    header { background: linear-gradient(135deg, #e5303f, #a30d22); color: #fff; padding: 28px 20px; }
    header .inner, main { max-width: 760px; margin: 0 auto; }
    header strong { font-size: 22px; letter-spacing: .2px; }
    main { padding: 28px 20px 64px; }
    h1 { font-size: 30px; line-height: 1.25; margin: 0 0 12px; }
    h2 { font-size: 21px; margin: 34px 0 8px; color: var(--red); }
    a { color: var(--red); }
    ul { padding-left: 22px; }
    li { margin: 6px 0; }
    footer { max-width: 760px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header><div class="inner"><strong>PDF Reader, Editor &amp; Tools</strong></div></header>
  <main>
    {{ content }}
  </main>
  <footer>&copy; Daily Applications</footer>
</body>
</html>
